name: Build Windows 11

# Compila la app para Windows en un runner `windows-latest`, porque Flutter no
# permite compilar para Windows desde Linux/macOS (necesita MSVC + Windows SDK).
#
# ---------------------------------------------------------------------------
# Publicación de Releases
#
# El flujo normal es: subes `version:` en pubspec.yaml, haces push a main, y el
# CI publica la Release solo. La etiqueta (v1.0.0) la crea el propio workflow,
# no hace falta crearla a mano.
#
# Es idempotente: si ya existe una Release con esa versión, NO se publica otra
# vez. Así que puedes empujar a main mil veces con la misma versión y no pasa
# nada; solo se publica cuando cambias el número.
#
# También funciona si prefieres mandar: empujar una etiqueta v* publica con ese
# nombre, tenga o no que ver con pubspec.yaml.
# ---------------------------------------------------------------------------
# OJO CON LOS NOMBRES: aparecen tres cosas que se llaman parecido
#
# 1. build/windows/x64/runner/Release/
#    Carpeta de SALIDA DE FLUTTER. "Release" = compilación optimizada, frente a
#    "Debug". No tiene nada que ver con GitHub.
#
# 2. Artifact de Actions (actions/upload-artifact)
#    Adjunto TEMPORAL del run: aparece en la pestaña Actions, requiere sesión
#    para descargarlo y CADUCA. Para probar, no para repartir.
#
# 3. GitHub Release (softprops/action-gh-release)
#    Publicación PERMANENTE y versionada, con URL estable en la pestaña
#    Releases. ES LO QUE SE REPARTE.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.6'

# Evita que dos ejecuciones del mismo ref se pisen (era lo que cancelaba runs).
# Las etiquetas nunca se cancelan: una Release a medias sería peor que esperar.
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-windows:
    name: Compilar para Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    # Necesario para que el token pueda crear la Release y su etiqueta.
    permissions:
      contents: write

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Habilitar el soporte de escritorio para Windows
        run: flutter config --enable-windows-desktop

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar el código
        run: flutter analyze

      - name: Leer la versión de pubspec.yaml
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)\s*$'
          if (-not $line) { throw 'No se encontró "version:" en pubspec.yaml' }
          # "1.0.0+1" -> "1.0.0"
          $version = $line.Matches[0].Groups[1].Value.Split('+')[0]
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Versión con formato inesperado: $version"
          }
          Write-Host "Versión de pubspec.yaml: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Compilar (release)
        run: flutter build windows --release

      - name: Verificar el ejecutable generado
        shell: pwsh
        run: |
          $exe = "build/windows/x64/runner/Release/rundown.exe"
          if (-not (Test-Path $exe)) { throw "No se generó $exe" }
          Get-Item $exe | Format-List Name, Length, LastWriteTime

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compilar el instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $iscc) { throw 'No se encontró ISCC.exe' }

          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "installer\rundown.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC falló con código $LASTEXITCODE" }

          Get-ChildItem dist | Format-Table Name, Length -AutoSize

      # --- Release ----------------------------------------------------------
      # El nombre de la etiqueta: si el push ya trae una etiqueta v*, se respeta
      # esa; si no, se deduce de pubspec.yaml.
      - name: Determinar la etiqueta de la Release
        id: tag
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $ref     = "${{ github.ref }}"
          $version = "${{ steps.version.outputs.version }}"

          if ($ref -like 'refs/tags/*') {
            $tag = $ref -replace '^refs/tags/', ''
            if ($tag -ne "v$version") {
              Write-Warning "La etiqueta ($tag) no coincide con pubspec.yaml (v$version). Se publica como $tag."
            }
          } else {
            $tag = "v$version"
          }
          Write-Host "Etiqueta de la Release: $tag"
          "name=$tag" >> $env:GITHUB_OUTPUT

      - name: ¿Ya existe una Release con esta etiqueta?
        id: exists
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.tag.outputs.name }}"
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Ya existe la Release $tag: no se publica otra vez."
            "value=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No existe la Release $tag: se publicará."
            "value=false" >> $env:GITHUB_OUTPUT
          }

      - name: Publicar la Release
        if: github.event_name != 'pull_request' && steps.exists.outputs.value == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Rundown Timer ${{ steps.tag.outputs.name }}
          # Si la etiqueta no existe, se crea apuntando a este commit.
          target_commitish: ${{ github.sha }}
          files: dist/rundown-setup-*.exe
          generate_release_notes: true
          body: |
            Instalador de Rundown Timer para Windows 10/11 (64 bits).

            **Instalación**: descarga `rundown-setup-*.exe` y ejecútalo. No pide
            permisos de administrador: se instala en tu perfil de usuario.

            El archivo no está firmado digitalmente, así que Windows SmartScreen
            mostrará un aviso la primera vez. Elige *Más información* →
            *Ejecutar de todas formas*.

      - name: Avisar de que la versión ya estaba publicada
        if: github.event_name != 'pull_request' && steps.exists.outputs.value == 'true'
        run: |
          Write-Host "::notice title=Release omitida::Ya existía ${{ steps.tag.outputs.name }}. Sube 'version:' en pubspec.yaml para publicar una nueva."

      # --- Artifacts: adjuntos temporales, para desarrollo -------------------
      - name: Adjuntar el instalador (temporal, caduca)
        uses: actions/upload-artifact@v7
        with:
          name: instalador-windows-x64
          path: dist/rundown-setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Adjuntar los archivos de compilación (solo para depurar)
        uses: actions/upload-artifact@v7
        with:
          name: compilacion-windows-x64-sin-comprimir
          # Salida cruda de Flutter: rundown.exe + DLLs + data/.
          # NO se reparte: para el usuario final está el instalador.
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 30

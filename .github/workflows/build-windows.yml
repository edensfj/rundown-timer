name: Build Windows 11

# Compila la app para Windows en un runner `windows-latest`, porque Flutter no
# permite compilar para Windows desde Linux/macOS (necesita MSVC + Windows SDK).
#
# ---------------------------------------------------------------------------
# OJO CON LOS NOMBRES: aquí aparecen tres cosas distintas que se llaman parecido
#
# 1. build/windows/x64/runner/Release/
#    Es la carpeta de SALIDA DE FLUTTER. "Release" aquí significa "compilación
#    optimizada", en oposición a "Debug". No tiene NADA que ver con GitHub.
#
# 2. Artifact de Actions (actions/upload-artifact)
#    Un adjunto TEMPORAL del run. Aparece en la pestaña Actions, dentro de la
#    ejecución concreta. Se descarga solo con la sesión de GitHub iniciada, se
#    guarda comprimido y CADUCA. Sirve para desarrollo/pruebas, no para repartir.
#
# 3. GitHub Release (softprops/action-gh-release)
#    Una publicación PERMANENTE y versionada, con etiqueta (p. ej. v1.0.0), que
#    aparece en la sección "Releases" del repo y da una URL pública estable.
#    ES LO QUE SE REPARTE A LOS USUARIOS.
#
# Por eso: al empujar a main solo se generan artifacts (para probar). Al empujar
# una etiqueta v* se genera además una Release con el instalador adjunto.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  build-windows:
    name: Compilar para Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    # Necesario para que el token pueda crear la Release.
    permissions:
      contents: write

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Habilitar el soporte de escritorio para Windows
        run: flutter config --enable-windows-desktop

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar el código
        run: flutter analyze

      - name: Leer la versión de pubspec.yaml
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)\s*$'
          if (-not $line) { throw 'No se encontró "version:" en pubspec.yaml' }
          # "1.0.0+1" -> "1.0.0"
          $version = $line.Matches[0].Groups[1].Value.Split('+')[0]
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Versión con formato inesperado: $version"
          }
          Write-Host "Versión detectada: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Compilar (release)
        run: flutter build windows --release

      - name: Verificar el ejecutable generado
        shell: pwsh
        run: |
          $exe = "build/windows/x64/runner/Release/rundown.exe"
          if (-not (Test-Path $exe)) { throw "No se generó $exe" }
          Get-Item $exe | Format-List Name, Length, LastWriteTime

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compilar el instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $iscc) { throw 'No se encontró ISCC.exe' }

          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "installer\rundown.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC falló con código $LASTEXITCODE" }

          Get-ChildItem dist | Format-Table Name, Length -AutoSize

      # --- Release: solo al empujar una etiqueta v* -------------------------
      - name: Publicar la Release con el instalador
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Rundown Timer ${{ github.ref_name }}
          files: dist/rundown-setup-*.exe
          generate_release_notes: true
          body: |
            Instalador de Rundown Timer para Windows 10/11 (64 bits).

            **Instalación**: descarga `rundown-setup-*.exe` y ejecútalo. No pide
            permisos de administrador: se instala en tu perfil de usuario.

            El archivo no está firmado digitalmente, así que Windows SmartScreen
            mostrará un aviso la primera vez. Elige *Más información* →
            *Ejecutar de todas formas*.

      # --- Artifacts: adjuntos temporales del run, para desarrollo -----------
      - name: Adjuntar el instalador (temporal, caduca)
        uses: actions/upload-artifact@v7
        with:
          name: instalador-windows-x64
          path: dist/rundown-setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Adjuntar los archivos de compilación (solo para depurar)
        uses: actions/upload-artifact@v7
        with:
          name: compilacion-windows-x64-sin-comprimir
          # Salida cruda de Flutter: rundown.exe + DLLs + data/.
          # NO se reparte: para el usuario final está el instalador.
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 30

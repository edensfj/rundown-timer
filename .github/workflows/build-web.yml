name: Build Web

# Compila la versión web y deja el paquete listo para descargar desde Actions.
#
# Flutter no genera un `index.js` ni un `index.css` al uso: el resultado es una
# carpeta (`build/web`) con `index.html`, `main.dart.js`, `assets/`, `canvaskit/`
# y el resto de archivos que necesita el navegador. Hay que copiar la carpeta
# completa y servirla por HTTP; abrir `index.html` con file:// no funciona.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.6'

concurrency:
  group: build-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Compilar para Web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar el código
        run: flutter analyze

      - name: Compilar (release)
        run: flutter build web --release

      - name: Adjuntar la carpeta web
        uses: actions/upload-artifact@v7
        with:
          name: rundown-web
          path: build/web/
          if-no-files-found: error
          retention-days: 30
